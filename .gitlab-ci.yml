# Crosscut — GitLab CI/CD Pipeline

stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NPM_CACHE_DIR: "$CI_PROJECT_DIR/.cache/npm"

# ── Lint ──────────────────────────────────────────────────────────────────────

lint:backend:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install ruff mypy
    - cd backend
    - ruff check app/
    - ruff format --check app/
  cache:
    paths:
      - .cache/pip

lint:dashboard:
  stage: lint
  image: node:20-alpine
  script:
    - cd dashboard
    - npm ci --cache $NPM_CACHE_DIR
    - npm run lint
  cache:
    paths:
      - .cache/npm

# ── Test ──────────────────────────────────────────────────────────────────────

test:backend:
  stage: test
  image: python:3.12-slim
  script:
    - cd backend
    - pip install -e ".[dev]"
    - pytest -v --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml

test:dashboard:
  stage: test
  image: node:20-alpine
  script:
    - cd dashboard
    - npm ci
    - npm run build
  cache:
    paths:
      - .cache/npm
